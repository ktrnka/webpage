<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">The six-level efficacy ladder for a diagnostic technology (Fryback and Thornbury 1991)</title>
  <desc id="desc">A six-rung ladder. Level 1 technical quality; Level 2 diagnostic accuracy; Level 3 changes the doctor's thinking; Level 4 changes what the doctor does; Level 5 patient better off; Level 6 societal cost and benefit. Markers show that nearly all AI-versus-clinician results sit on Level 2, a few laboratory and trial studies reach Levels 3 to 5, and 18 of 100 commercial radiology AI products have any evidence above Level 2.</desc>

  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>
  <!-- rails -->
  <rect x="60" y="20" width="10" height="430" rx="3" fill="#7a7a7a"/>
  <rect x="330" y="20" width="10" height="430" rx="3" fill="#7a7a7a"/>

  <!-- rungs, bottom = level 1 -->
  <g font-size="13" fill="#222">
    <!-- Level 6 -->
    <rect x="70" y="40" width="260" height="10" fill="#9a9a9a"/>
    <text x="80" y="34" font-weight="bold">6  Society</text>
    <text x="80" y="62" font-size="11" fill="#444">cost and benefit at scale</text>

    <!-- Level 5 -->
    <rect x="70" y="112" width="260" height="10" fill="#9a9a9a"/>
    <text x="80" y="90" font-weight="bold">5  Patient outcome</text>
    <text x="80" y="106" font-size="11" fill="#444">is the patient better off?</text>

    <!-- Level 4 -->
    <rect x="70" y="184" width="260" height="10" fill="#9a9a9a"/>
    <text x="80" y="162" font-weight="bold">4  Management</text>
    <text x="80" y="178" font-size="11" fill="#444">does the doctor do something different?</text>

    <!-- Level 3 -->
    <rect x="70" y="256" width="260" height="10" fill="#9a9a9a"/>
    <text x="80" y="234" font-weight="bold">3  Diagnostic thinking</text>
    <text x="80" y="250" font-size="11" fill="#444">does the doctor think something different?</text>

    <!-- Level 2, highlighted -->
    <rect x="70" y="328" width="260" height="10" fill="#c0392b"/>
    <text x="80" y="306" font-weight="bold" fill="#c0392b">2  Diagnostic accuracy</text>
    <text x="80" y="322" font-size="11" fill="#444">is the answer right? sensitivity, specificity, AUC</text>

    <!-- Level 1 -->
    <rect x="70" y="400" width="260" height="10" fill="#9a9a9a"/>
    <text x="80" y="378" font-weight="bold">1  Technical</text>
    <text x="80" y="394" font-size="11" fill="#444">is the image or signal good enough?</text>
  </g>

  <!-- necessary-but-not-sufficient arrow -->
  <g stroke="#7a7a7a" stroke-width="1.5" fill="none">
    <path d="M 30 420 L 30 50" marker-end="url(#arrow)"/>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a7a7a"/>
    </marker>
  </defs>
  <text x="22" y="240" font-size="10" fill="#555" transform="rotate(-90 22 240)" text-anchor="middle">each rung is necessary for the one above, and does not guarantee it</text>

  <!-- where the evidence sits -->
  <g font-size="12" fill="#222">
    <text x="370" y="30" font-weight="bold" font-size="13">Where the studies in this piece sit</text>

    <!-- L2 cluster -->
    <line x1="340" y1="333" x2="362" y2="333" stroke="#c0392b" stroke-width="2"/>
    <text x="370" y="326" fill="#c0392b" font-weight="bold">Nearly everything</text>
    <text x="370" y="342" font-size="11" fill="#444">all the meta-analyses in sections 1 and 2;</text>
    <text x="370" y="357" font-size="11" fill="#444">Watson and Babylon; MAI-DxO, AMIE, o1 on CPCs</text>

    <!-- L3 -->
    <line x1="340" y1="261" x2="362" y2="261" stroke="#7a7a7a" stroke-width="2"/>
    <text x="370" y="257" font-size="11" fill="#444">Dratsch (planted wrong suggestions); Goh (GPT-4 trial)</text>

    <!-- L4 -->
    <line x1="340" y1="189" x2="362" y2="189" stroke="#7a7a7a" stroke-width="2"/>
    <text x="370" y="185" font-size="11" fill="#444">Fenton: CAD mammography, biopsies up 14.7 to 17.6 per 1,000</text>

    <!-- L5 -->
    <line x1="340" y1="117" x2="362" y2="117" stroke="#7a7a7a" stroke-width="2"/>
    <text x="370" y="106" font-size="11" fill="#444">Zhou: 65 randomised trials of AI prediction tools,</text>
    <text x="370" y="121" font-size="11" fill="#444">40% no benefit despite AUC above 0.8</text>

    <!-- products note -->
    <rect x="370" y="395" width="370" height="52" rx="6" fill="none" stroke="#bbb"/>
    <text x="382" y="415" font-size="11" fill="#444">Of 100 commercial radiology AI products, 18 had any</text>
    <text x="382" y="431" font-size="11" fill="#444">evidence above Level 2 (van Leeuwen 2021)</text>
  </g>
</svg>
